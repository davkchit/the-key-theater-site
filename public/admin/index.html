<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Театр Ключ — админка</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
    <script>
      // Custom preview panes so editors see something close to the real
      // site cards instead of Decap's default plain field dump. `createClass`
      // and `h` are globals the decap-cms UMD bundle exposes for exactly this
      // no-build-step use case. Colors/layout are hand-copied from
      // TeamCard.tsx / ShowCard.tsx -- not pixel-perfect, just recognizable.
      var BRAND_BG = { yellow: '#FFD700', red: '#E32324', blue: '#0B54A0', ink: '#1A1A1A' }
      var PAPER = '#F6F0E0'
      var INK = '#1A1A1A'
      var baseFont = '-apple-system, "Segoe UI", Roboto, sans-serif'

      // getAsset() doesn't resolve reliably under local_backend (Decap's own
      // default preview shows the same broken-image icon for these fields),
      // so skip it and build the <img src> ourselves. This file lives in
      // public/ so Vite never processes it -- no import.meta.env.BASE_URL
      // available here -- so the site's base path (e.g. "/the-key-theater-site/",
      // a GitHub Pages crutch, see vite.config.ts) is recovered from wherever
      // this very page's URL turned out to be, instead of hardcoding it.
      var SITE_BASE = window.location.pathname.replace(/admin\/?(index\.html)?$/, '')
      var AssetImage = createClass({
        render: function () {
          if (!this.props.path) return this.props.fallback || null
          return h('img', { src: SITE_BASE + this.props.path.replace(/^\//, ''), style: this.props.style })
        },
      })

      var TeamPreview = createClass({
        render: function () {
          var members = this.props.entry.getIn(['data', 'members']) || []
          var cards = members
            .map(function (m, i) {
              var bg = m.get('bg') || 'ink'
              var fg = bg === 'yellow' ? INK : PAPER
              var roleColor = bg === 'yellow' ? '#4a3f14' : '#D8D2C4'
              return h(
                'div',
                {
                  key: i,
                  style: { background: BRAND_BG[bg] || INK, color: fg, borderRadius: 14, border: '2px solid ' + INK, overflow: 'hidden' },
                },
                h(
                  'div',
                  { style: { aspectRatio: '3/4', background: INK, overflow: 'hidden' } },
                  h(AssetImage, {
                    path: m.get('photo'),
                    style: { width: '100%', height: '100%', objectFit: 'cover', opacity: 0.85 },
                    fallback: h('div', { style: { width: '100%', height: '100%', background: PAPER } }),
                  }),
                ),
                h(
                  'div',
                  { style: { padding: 14 } },
                  h('div', { style: { fontWeight: 800, textTransform: 'uppercase', fontSize: 15 } }, m.get('name')),
                  h('div', { style: { marginTop: 6, fontSize: 12.5, color: roleColor } }, m.get('role')),
                ),
              )
            })
            .toArray()
          return h(
            'div',
            { style: { background: PAPER, padding: 20, fontFamily: baseFont } },
            h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(160px, 1fr))', gap: 12 } }, cards),
          )
        },
      })

      var ShowsPreview = createClass({
        render: function () {
          var shows = this.props.entry.getIn(['data', 'shows']) || []
          var cards = shows
            .map(function (s, i) {
              var bg = s.get('bg') || 'ink'
              return h(
                'div',
                { key: i, style: { background: PAPER, border: '2px solid ' + INK, borderRadius: 14, overflow: 'hidden' } },
                h(
                  'div',
                  { style: { aspectRatio: '71/100', background: BRAND_BG[bg] || INK, overflow: 'hidden' } },
                  h(AssetImage, {
                    path: s.get('photo'),
                    style: { width: '100%', height: '100%', objectFit: 'cover' },
                  }),
                ),
                h(
                  'div',
                  { style: { padding: 16 } },
                  s.get('genre') ? h('div', { style: { fontSize: 10, fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', color: BRAND_BG.red, marginBottom: 4 } }, s.get('genre')) : null,
                  h('div', { style: { fontWeight: 800, textTransform: 'uppercase', fontSize: 20 } }, s.get('title')),
                  h('div', { style: { marginTop: 8, fontSize: 13, color: '#33302a' } }, s.get('based')),
                  h(
                    'div',
                    { style: { marginTop: 10, display: 'flex', justifyContent: 'space-between', fontSize: 11, textTransform: 'uppercase', color: '#6B655A' } },
                    h('span', {}, s.get('dir') ? 'реж. ' + s.get('dir') : ''),
                    h('span', {}, s.get('dur') || ''),
                  ),
                ),
              )
            })
            .toArray()
          return h(
            'div',
            { style: { background: PAPER, padding: 20, fontFamily: baseFont } },
            h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: 16 } }, cards),
          )
        },
      })

      var GalleryPreview = createClass({
        render: function () {
          var images = this.props.entry.getIn(['data', 'images']) || []
          var tiles = images
            .map(function (g, i) {
              var wide = g.get('span') === 'wide'
              return h(
                'div',
                {
                  key: i,
                  style: {
                    gridColumn: wide ? 'span 2' : 'span 1',
                    aspectRatio: wide ? '2/1' : '1/1',
                    background: INK,
                    borderRadius: 10,
                    overflow: 'hidden',
                    border: '2px solid ' + INK,
                  },
                },
                h(AssetImage, {
                  path: g.get('src'),
                  style: { width: '100%', height: '100%', objectFit: 'cover' },
                }),
              )
            })
            .toArray()
          return h(
            'div',
            { style: { background: PAPER, padding: 20 } },
            h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10 } }, tiles),
          )
        },
      })

      CMS.registerPreviewStyle('* { box-sizing: border-box; } body { margin: 0; }', { raw: true })
      CMS.registerPreviewTemplate('team', TeamPreview)
      CMS.registerPreviewTemplate('shows', ShowsPreview)
      CMS.registerPreviewTemplate('gallery', GalleryPreview)
    </script>
  </body>
</html>
