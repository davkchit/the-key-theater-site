# Site + bot on one server:
#
#   docker compose up -d --build
#
# The site listens on 127.0.0.1:${SITE_PORT} only (default 8080). The server's
# own proxy (the one that already serves the other projects) forwards the
# domain there and does HTTPS. See bot/DEPLOY.md.
#
# Secrets come from .env.bot next to this file (never in the images).

services:
  site:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SITE_PORT:-8080}:80"
    mem_limit: 96m
    depends_on:
      - bot

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file: .env.bot
    environment:
      # knowledge.json straight from the site container, refreshed every 10 min
      SITE_URL: http://site
      TRUST_PROXY: "1"
    volumes:
      # leads and chats live on the server's disk, outside the container:
      # rebuilds and restarts keep them, backups copy this folder
      - ./bot/data:/data
    mem_limit: 256m
