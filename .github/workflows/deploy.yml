name: Deploy to GitHub Pages

# Deploy-target crutch, like the HashRouter swap and the vite base path --
# delete this file (and disable Pages in repo settings) if the site ever
# moves off GitHub Pages, no other cleanup needed.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --legacy-peer-deps: eslint-plugin-jsx-a11y@6.10.2's peer range caps at
      # eslint ^9, but the project is on eslint ^10.6.0 -- an upstream gap,
      # not a build issue (eslint isn't part of `vite build`). Drop this flag
      # once jsx-a11y (or a replacement) declares eslint 10 support.
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
