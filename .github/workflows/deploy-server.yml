name: Deploy to the theatre's server

# Every change on master — code or an edit made in the admin (/admin) —
# rebuilds the site and puts it on the VPS. The key in DEPLOY_SSH_KEY can do
# exactly one thing on the server: replace the site's files
# (/usr/local/sbin/kluch-site-update, forced by authorized_keys).
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          VITE_BASE: /
      - name: Upload to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY is not set: skipping the upload"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # the server's own key, so nobody can pretend to be it
          echo '194.226.123.13 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHwOZGNhHlWD048+e9iTw67kTlBrkH78wgeaalqbCbSM' > ~/.ssh/known_hosts
          tar -czf - -C dist . | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes kluch-deploy@194.226.123.13
